name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore

    - name: Test
      run: dotnet test --no-build --verbosity normal

    - name: Login to ACR
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}
    
    - name: Docker Build and Tag # This step builds builds the image and tags it traceable 
      run: |
        IMAGE_TAG=$(echo ${{ github.sha }} | cut -c1-7)
        FULL_IMAGE_NAME="${{ secrets.ACR_LOGIN_SERVER }}/inventory-api:$IMAGE_TAG"
        docker build -t $FULL_IMAGE_NAME -f CloudNativeInventory.Api/Dockerfile .
        docker push $FULL_IMAGE_NAME